---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Exists
          effect: NoSchedule
      nodeSelector: {type: kwok}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: web}
      containers:
        - name: app
          image: registry.k8s.io/pause:3.9
          # Literal values are the only dependency source the tool reads; it
          # never reads ConfigMap or Secret contents.
          env:
            - name: SESSIONS
              value: redis://session-store:6379/0
            - name: DATABASE_URL
              value: postgres://orders-db:5432/orders
          resources:
            requests: {cpu: 100m, memory: 128Mi}
