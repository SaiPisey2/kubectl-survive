# The image is built by the release workflow with ko and published to GHCR for
# linux/amd64 and linux/arm64. Pin it to the release you are running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-survive-exporter
  namespace: kubectl-survive
  labels:
    app.kubernetes.io/name: kubectl-survive-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubectl-survive-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubectl-survive-exporter
    spec:
      serviceAccountName: kubectl-survive-exporter
      containers:
        - name: exporter
          image: ghcr.io/saipisey2/kubectl-survive:v0.4.0
          # The image's entrypoint is the plugin binary itself, so the first
          # argument is the subcommand. Prefixing it with the plugin name, as
          # kubectl does on the command line, fails with "unknown command".
          args:
            - export
            - --listen=:9090
            - --domain-key=topology.kubernetes.io/zone
            - --interval=60s
          ports:
            - name: metrics
              containerPort: 9090
          # This binary only reads the API server; it has nothing else to
          # wait on, so a working /metrics response is a meaningful readiness
          # signal, not a rubber stamp.
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
