name: ci
on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v7
        with: {go-version: "1.26"}
      - run: make verify-attribution
      - run: make verify-fmt
      - run: make verify-deps
      - run: make verify-replaces
      - run: go vet ./...
      - run: go test ./... -count=1 -race
      - run: make build

  differential:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: "1.26"}
      - name: Install kwokctl
        run: |
          KWOK_VERSION=v0.8.0
          curl -sSLo kwokctl "https://github.com/kubernetes-sigs/kwok/releases/download/${KWOK_VERSION}/kwokctl-linux-amd64"
          chmod +x kwokctl && sudo mv kwokctl /usr/local/bin/
          kwokctl --version
      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -sSL https://dl.k8s.io/release/stable.txt)"
          curl -sSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          kubectl version --client
      - name: Differential run
        env:
          # Per-PR budget. The nightly schedule raises it. Validate the real
          # per-scenario cost with a timed pilot before trusting a larger number.
          SURVIVE_SCENARIOS: ${{ github.event_name == 'schedule' && '200' || '20' }}
        run: go test -tags harness ./test/harness/ -v -timeout 60m
