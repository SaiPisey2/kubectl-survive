name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Needed to publish the exporter image to GHCR.
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v7
        with: {go-version: "1.26"}
      - run: make verify-deps
      - run: go test ./... -count=1
      # goreleaser shells out to syft to attach an SBOM per archive.
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The krew manifest is rendered, never pushed: krew-index submission is a
      # reviewed pull request opened by hand.
      - uses: actions/upload-artifact@v7
        with:
          name: krew-manifest
          path: dist/krew/*.yaml
