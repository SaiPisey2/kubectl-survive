version: 2

project_name: kubectl-survive

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: kubectl-survive
    main: ./cmd/kubectl-survive_zone
    binary: kubectl-survive_zone
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/SaiPisey2/kubectl-survive/internal/version.version={{ .Version }}
      - -X github.com/SaiPisey2/kubectl-survive/internal/version.commit={{ .FullCommit }}
      - -X github.com/SaiPisey2/kubectl-survive/internal/version.date={{ .CommitDate }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [kubectl-survive]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # krew requires the licence to travel inside the archive.
    files:
      - LICENSE
      - README.md

# The exporter's container image. ko builds straight from the Go build above,
# so there is no Dockerfile to drift from it, and the default base is a
# distroless static image that runs as a non-root user -- which is what
# deploy/deployment.yaml's runAsNonRoot requires.
kos:
  - id: exporter
    build: kubectl-survive
    main: ./cmd/kubectl-survive_zone
    repositories: [ghcr.io/saipisey2/kubectl-survive]
    tags: ["v{{ .Version }}", latest]
    bare: true
    preserve_import_paths: false
    platforms: [linux/amd64, linux/arm64]
    sbom: none
    labels:
      org.opencontainers.image.source: https://github.com/SaiPisey2/kubectl-survive
      org.opencontainers.image.description: Prometheus exporter for kubectl survive-zone
      org.opencontainers.image.licenses: Apache-2.0

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto

krews:
  - name: survive-zone
    ids: [default]
    homepage: https://github.com/SaiPisey2/kubectl-survive
    # krew renders this in `kubectl krew search` and `list`, where the column
    # is narrow, so the index caps it at 50 characters. It is a tagline, not a
    # sentence.
    short_description: Show which workloads die when a zone is lost
    description: |
      Reads real pod placement rather than declared intent, removes a failure
      domain, and reports which workloads stop serving. Also detects
      PodDisruptionBudgets that can never be satisfied and so hang node drains.
      Read-only: it never evicts, cordons or deletes anything.
    # The manifest is rendered into dist/ for a manual krew-index pull request.
    # Nothing is pushed: krew-index submission is reviewed by humans.
    skip_upload: true
